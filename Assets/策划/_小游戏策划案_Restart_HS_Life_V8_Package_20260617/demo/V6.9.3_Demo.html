<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>重启我的高中人生·爽玩版 — V6.8 卡牌消耗制 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#F0E6DC;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;position:relative;overflow:hidden}
:root{--bg-page:#FFF8F0;--primary:#6B9DF7;--secondary:#FFB5B5;--gold:#FFD580;--green:#7BC06B;--orange:#FF9E5C;--red:#FF6B6B;--dark-red:#C93030;--text:#4A3A2E;--text-soft:#9B7E6E;--line:#F0E0D0;--si-color:#6B9DF7;--si-soft:#E5F0FB;--xing-color:#FF9E5C;--xing-soft:#FFE5D9;--relief-color:#7BC06B;--relief-soft:#E8F5E0;--selected-gold:#FFD580}
.phone-frame{width:414px;height:920px;background:#1a1a1a;border-radius:48px;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,0.25),0 0 0 2px #2a2a2a;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center center;will-change:transform;aspect-ratio:414/920}
.phone-frame::before{content:'';position:absolute;top:18px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#1a1a1a;border-radius:14px;z-index:2}
.screen{width:100%;height:100%;background:var(--bg-page);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;padding:50px 14px 12px 14px;position:relative;transition:all .3s}
.screen.danger-pulse{animation:edge-pulse .8s ease-in-out infinite}
.screen.collapse-pulse{animation:edge-pulse-collapse .4s ease-in-out infinite}
@keyframes edge-pulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,107,107,0)}50%{box-shadow:inset 0 0 0 4px rgba(255,107,107,.6)}}
@keyframes edge-pulse-collapse{0%,100%{box-shadow:inset 0 0 0 0 rgba(201,48,48,0);background-color:var(--bg-page)}50%{box-shadow:inset 0 0 0 6px rgba(201,48,48,.8);background-color:#FFE5E5}}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:5px}
.stat-chip{background:#fff;border-radius:12px;padding:5px 3px;text-align:center;box-shadow:0 2px 0 var(--c,#ccc)}
.stat-chip .stat-emoji{font-size:14px;line-height:1}
.stat-chip .stat-name{font-size:9px;color:var(--text-soft);margin-top:1px}
.stat-chip .stat-value{font-size:15px;font-weight:700;color:var(--c,#555);line-height:1.1}
.hud-extras{display:flex;gap:5px;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.energy-chip{background:#fff;border-radius:10px;padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:3px;border:2px solid transparent;transition:all .2s}
.energy-chip .ec-label{color:var(--text-soft)}
.energy-chip .ec-value{font-weight:700}
.energy-chip.high{border-color:var(--orange);background:#FFF4E5}
.energy-chip.danger{border-color:var(--red);background:#FFE5E5}
/* V6.9 顶部精力条（显眼 + 档位 + 乘数） */
.energy-hud-bar{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;margin:0 16px 6px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--line);position:relative;z-index:5}
.ehb-left{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ehb-emoji{font-size:18px;line-height:1}
.ehb-label{font-size:11px;color:var(--text-soft);font-weight:bold}
.ehb-zone{font-size:12px;font-weight:bold;letter-spacing:1px}
.ehb-bar{flex:1;height:14px;background:#F0E0D0;border-radius:7px;overflow:hidden;border:1.5px solid var(--line);position:relative}
.ehb-fill{height:100%;border-radius:5px;transition:width .4s ease,background .4s ease;box-shadow:0 0 6px rgba(0,0,0,.08) inset}
.ehb-right{display:flex;align-items:baseline;gap:4px;flex-shrink:0;min-width:60px;justify-content:flex-end}
.ehb-value{font-size:18px;font-weight:900;line-height:1}
.ehb-mult{font-size:10px;color:var(--text-soft);font-weight:bold;background:#FFE5D0;padding:1px 5px;border-radius:6px}
.energy-chip.collapse{border-color:var(--dark-red);background:#FFD5D5}
.deck-chip{background:#fff;border-radius:10px;padding:3px 7px;font-size:10px;display:flex;align-items:center;gap:3px}
.deck-chip .dc-label{color:var(--text-soft)}
.deck-chip .dc-value{font-weight:700;color:var(--primary)}
.deck-chip .dc-mini{font-size:9px;color:var(--text-soft);margin-left:2px}
.combo-chip{background:linear-gradient(135deg,#FFD580,#FFB5B5);border-radius:10px;padding:3px 7px;font-size:10px;font-weight:700;color:#fff;display:none}
.combo-chip.active{display:inline-flex;align-items:center;gap:2px}
.combo-chip.epic{background:linear-gradient(135deg,#FF6B6B,#FFD580);box-shadow:0 0 12px rgba(255,107,107,.6);animation:combo-glow .6s ease-in-out infinite}
@keyframes combo-glow{0%,100%{box-shadow:0 0 12px rgba(255,107,107,.6)}50%{box-shadow:0 0 24px rgba(255,107,107,1)}}
.stream-area{background:linear-gradient(180deg,#FFF4E5 0%,#FFF8F0 100%);border-radius:12px;padding:4px 8px;margin-bottom:6px;border-left:3px solid var(--gold);position:relative;height:74px;overflow:hidden}
.stream-list{position:relative;height:100%}
.stream-item{font-size:11px;color:var(--text);line-height:1.35;padding:1px 0;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stream-item.show{opacity:1;transform:translateY(0)}
.stream-item .stream-time{font-size:9px;color:#fff;font-weight:700;padding:1px 5px;background:var(--gold);border-radius:4px;margin-right:4px;flex-shrink:0}
.event-card{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;box-shadow:0 2px 6px rgba(0,0,0,.04);position:relative;border-left:4px solid var(--secondary);flex-shrink:0}
.event-card.si-type{border-left-color:var(--si-color)}
.event-card.xing-type{border-left-color:var(--xing-color)}
.event-type-tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:9px;font-weight:700;color:#fff;margin-bottom:4px}
.event-type-tag.si{background:var(--si-color)}
.event-type-tag.xing{background:var(--xing-color)}
.event-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.event-desc{font-size:11px;color:var(--text-soft);line-height:1.45}
.event-meta{display:flex;gap:6px;margin-top:4px;font-size:10px;color:var(--text-soft);align-items:center;flex-wrap:wrap}
.event-meta .event-complexity{color:var(--primary);font-weight:700}
.event-meta .event-observer{color:var(--orange);font-weight:700}
.hand-tip{font-size:10px;color:var(--text-soft);text-align:center;margin-bottom:4px;line-height:1.3}
.hand-tip b{color:var(--primary)}
.hand{display:flex;flex-direction:column;gap:4px;margin-bottom:4px;flex:1;overflow-y:auto;padding-right:2px}
.hand::-webkit-scrollbar{width:2px}
.hand::-webkit-scrollbar-thumb{background:var(--line);border-radius:1px}
.hand-card{background:#fff;border-radius:10px;padding:7px 9px;display:flex;align-items:center;gap:7px;position:relative;border:2px solid #fff;box-shadow:0 2px 0 var(--line);transition:all .15s;overflow:visible}
.hand-card:active{transform:scale(.98)}
.hand-card.si{box-shadow:0 2px 0 var(--si-soft)}
.hand-card.xing{box-shadow:0 2px 0 var(--xing-soft)}
.hand-card.relief{box-shadow:0 2px 0 var(--relief-soft);background:linear-gradient(180deg,#F5FBEF 0%,#fff 100%)}
.hand-card.selected{border-color:var(--selected-gold)!important;box-shadow:0 0 0 2px var(--selected-gold),0 4px 10px rgba(255,213,128,.4)!important;transform:translateY(-2px)}
.hand-card.selected::before{content:'✓';position:absolute;top:-6px;left:-6px;width:18px;height:18px;background:var(--selected-gold);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.hand-card.disabled{opacity:.4;pointer-events:none}
.hc-type-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hc-type-icon.si{background:var(--si-soft)}
.hc-type-icon.xing{background:var(--xing-soft)}
.hc-type-icon.relief{background:var(--relief-soft)}
.hc-content{flex:1;min-width:0}
.hc-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-effects{font-size:10px;line-height:1.3}
.hc-effects .positive{color:var(--green);font-weight:700}
.hc-effects .negative{color:var(--red);font-weight:700}
.hc-cost{font-size:9px;color:var(--orange);margin-top:1px}
.hc-discard-btn{font-size:9px;padding:3px 6px;border-radius:6px;border:1px solid #DDD;background:#fff;color:var(--text-soft);flex-shrink:0;font-weight:700}
.hc-discard-btn:active{background:#FFE5E5;border-color:var(--red);color:var(--red)}
.selection-info{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--text-soft);margin-bottom:4px;padding:0 2px}
.selection-info .sel-num{font-weight:700;color:var(--primary)}
.action-row{display:flex;gap:6px;margin-bottom:4px}
.btn-play{flex:2;padding:10px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;font-size:13px;font-weight:700;box-shadow:0 3px 0 #5A87D8;transition:all .1s}
.btn-play:disabled{background:#DDD;color:#999;box-shadow:0 2px 0 #BBB;pointer-events:none}
.btn-play:active{transform:translateY(1px);box-shadow:0 2px 0 #5A87D8}
.btn-ad{flex:1;padding:10px 6px;border-radius:12px;border:2px dashed var(--gold);background:#FFFBF0;color:var(--orange);font-size:11px;font-weight:700;transition:all .1s}
.btn-ad:disabled{background:#F5F5F5;color:#CCC;border-color:#DDD;pointer-events:none}
.btn-ad:active{background:#FFF4E5}
.progress{margin-top:3px}
.progress-text{font-size:10px;color:var(--text-soft);text-align:center;margin-bottom:2px}
.progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .3s}
.footer-tip{font-size:9px;color:var(--text-soft);text-align:center;padding:2px 0;opacity:.6}
/* V6.9.3 流水事件按钮 */
.stream-event-btn{background:linear-gradient(135deg,#FF7B7B,#FF6B6B);color:#FFF;border:none;padding:6px 14px;border-radius:14px;font-size:11px;font-weight:bold;margin-top:6px;margin-left:6px;cursor:pointer;box-shadow:0 3px 0 #C93030,0 4px 8px rgba(255,107,107,.3);display:inline-block;animation:eventBtnPulse 1.5s ease-in-out infinite;letter-spacing:0.5px}
.stream-event-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #C93030}
.stream-item.has-event{background:linear-gradient(90deg,#FFF5F0,#FFE5D0);border-left:3px solid #FF7B7B;border-radius:0 12px 12px 0;padding:8px 10px;margin:6px 0;box-shadow:0 2px 6px rgba(255,123,123,.15)}
@keyframes eventBtnPulse{0%,100%{box-shadow:0 3px 0 #C93030,0 4px 8px rgba(255,107,107,.3),0 0 0 0 rgba(255,107,107,.6)}50%{box-shadow:0 3px 0 #C93030,0 4px 8px rgba(255,107,107,.3),0 0 0 8px rgba(255,107,107,0)}}

/* V6.9.3 黑屏转场 */
.blackout-overlay{position:absolute;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:blackoutFade 1.6s ease-out}
.blackout-emoji{font-size:64px;margin-bottom:20px;animation:moonFloat 2s ease-in-out infinite}
.blackout-text{color:#FFF;font-size:18px;font-weight:bold;letter-spacing:2px;opacity:0.85}
@keyframes blackoutFade{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:1}}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* V6.9.3 结算页半身像 */
.settle-portrait-big{position:relative;width:90px;height:90px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,#FFE5D0,#FFD0C0);border:4px solid #FFF;box-shadow:0 6px 16px rgba(217,119,87,.3);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
.settle-portrait-big img{width:100%;height:100%;object-fit:cover;display:block}
.settle-portrait-big::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:12px solid #FFF}

.init-screen{padding:50px 20px 20px;overflow-y:auto}
.game-title{font-size:22px;font-weight:800;color:var(--text);text-align:center;margin-top:6px;background:linear-gradient(90deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.game-subtitle{font-size:13px;color:var(--text-soft);text-align:center;margin-top:4px;margin-bottom:10px}
.init-tip{font-size:11px;color:var(--text-soft);background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;line-height:1.6;border-left:3px solid var(--primary)}
.init-tip b{color:var(--text)}
.init-tip .legend{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.init-tip .legend-item{display:flex;align-items:center;gap:3px;padding:2px 6px;background:var(--bg-page);border-radius:6px;font-size:10px}
.legend-item.si{color:var(--si-color)}
.legend-item.xing{color:var(--xing-color)}
.legend-item.relief{color:var(--relief-color)}
.personality-grid{display:flex;flex-direction:column;gap:8px}
.personality-card{background:#fff;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 0 var(--line);transition:transform .1s}
.personality-card:active{transform:scale(.98)}
.p-emoji{font-size:26px;width:44px;height:44px;background:#FFF4E5;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-name{font-size:13px;font-weight:700;color:var(--text)}
.p-tag{font-size:9px;color:var(--text-soft);margin:1px 0}
.p-desc{font-size:10px;color:var(--text-soft);line-height:1.4}
.p-deck-preview{font-size:10px;margin-top:3px;padding:3px 6px;background:var(--bg-page);border-radius:6px;line-height:1.5}
.p-deck-preview .si{color:var(--si-color);font-weight:700}
.p-deck-preview .xing{color:var(--xing-color);font-weight:700}
.p-deck-preview .relief{color:var(--relief-color);font-weight:700}
.settlement{padding:50px 18px 18px;overflow-y:auto}
.settle-title{font-size:20px;font-weight:800;text-align:center;margin-top:4px;color:var(--text)}
.settle-sub{font-size:10px;text-align:center;color:var(--text-soft);margin:3px 0 10px}
.energy-final{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 0 var(--line)}
.energy-final .pf-label{font-size:11px;color:var(--text-soft);flex-shrink:0}
.energy-final .pf-bar{flex:1;height:14px;background:#F0E0D0;border-radius:7px;overflow:hidden;position:relative}
.energy-final .pf-fill{height:100%;background:linear-gradient(90deg,#7BC06B,#FFD580,#FF6B6B,#C93030);transition:width .5s;border-radius:7px}
.energy-final .pf-value{font-size:18px;font-weight:800;flex-shrink:0}
.final-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.fs-item{background:#fff;border-radius:10px;padding:6px 3px;text-align:center;box-shadow:0 2px 0 var(--c)}
.fs-item .fs-emoji{font-size:18px}
.fs-item .fs-name{font-size:9px;color:var(--text-soft)}
.fs-item .fs-value{font-size:16px;font-weight:800;color:var(--c)}
.settle-extras{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.se-item{background:#fff;border-radius:10px;padding:6px;text-align:center}
.se-item .se-label{font-size:9px;color:var(--text-soft)}
.se-item .se-value{font-size:14px;font-weight:800;margin-top:2px}
.log-list{background:#fff;border-radius:12px;padding:8px;margin-bottom:10px}
.log-list-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:4px}
.log-item{font-size:10px;padding:4px 0;border-bottom:1px solid var(--line);line-height:1.4}
.log-item:last-child{border-bottom:none}
.log-event{font-weight:700;color:var(--text)}
.log-action{color:var(--text-soft);font-size:9px}
.log-result.success{color:var(--green)}
.log-result.soft-mis{color:var(--orange)}
.log-result.mid-mis{color:#FF6B3B}
.log-result.hard-mis{color:var(--red)}
.log-result.relief{color:var(--relief-color)}
.action-row-end{display:flex;gap:6px}
.btn{flex:1;padding:10px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 3px 0 #5A87D8}
.modal{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10;border-radius:36px}
.modal-content{background:#fff;border-radius:18px;padding:14px 16px;width:85%;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:modal-in .25s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes modal-in{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-title{font-size:15px;font-weight:800;margin-bottom:5px}
.modal-title.success{color:var(--green)}
.modal-title.soft-mis{color:var(--orange)}
.modal-title.mid-mis{color:#FF6B3B}
.modal-title.hard-mis{color:var(--red)}
.modal-title.info{color:var(--text)}
.modal-title.relief{color:var(--relief-color)}
.modal-desc{font-size:11px;color:var(--text-soft);line-height:1.5;margin-bottom:8px}
.modal-stats{background:var(--bg-page);border-radius:10px;padding:6px 8px;margin-bottom:10px}
.ms-row{display:flex;justify-content:space-between;font-size:10px;padding:2px 0}
.ms-label{color:var(--text-soft)}
.ms-value{font-weight:700}
.ms-value.positive{color:var(--green)}
.ms-value.negative{color:var(--red)}
.modal-close-btn{width:100%;padding:9px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-size:12px;font-weight:700;transition:transform .1s}
.modal-close-btn:active{transform:scale(.95);background:#5A87D8}
.screen-shake-light{animation:shake-light .2s}
@keyframes shake-light{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.fly-number{position:fixed;pointer-events:none;z-index:200;font-size:24px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.2);animation:fly-up 2.5s ease-out forwards}
.fly-number.positive{color:var(--green)}
.fly-number.combo{color:var(--gold);font-size:30px}
@keyframes fly-up{0%{transform:translateY(0) scale(.5);opacity:0}20%{transform:translateY(-20px) scale(1.2);opacity:1}100%{transform:translateY(-160px) scale(1);opacity:0}}
.fly-number-down{position:fixed;pointer-events:none;z-index:200;font-size:22px;font-weight:900;color:var(--red);text-shadow:0 2px 4px rgba(0,0,0,.2);animation:fly-down 2.5s ease-out forwards}
@keyframes fly-down{0%{transform:translateY(0) scale(.5);opacity:0}20%{transform:translateY(20px) scale(1.2);opacity:1}100%{transform:translateY(120px) scale(.8);opacity:0}}
.perfect-burst{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999}
.perfect-particle{position:absolute;width:10px;height:10px;border-radius:50%;animation:perfect-burst 1.2s ease-out forwards}
@keyframes perfect-burst{0%{transform:translate(0,0) scale(0);opacity:1}50%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.ad-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:36px}
.ad-content{color:#fff;text-align:center}
.ad-content .ad-title{font-size:16px;font-weight:800;margin-bottom:8px}
.ad-content .ad-desc{font-size:11px;color:#FFD580;margin-bottom:12px}
.ad-content .ad-timer{font-size:24px;font-weight:800;color:var(--gold);margin-bottom:12px}
.ad-skip{padding:8px 16px;background:#555;color:#fff;border:none;border-radius:8px;font-size:11px}

/* V6.4-V6.5 新增：事件作为弹窗（覆盖在流水账上） */
.event-modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,248,240,.92);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .25s ease;padding:14px}
.event-modal{width:100%;max-width:540px;background:#FFF8F0;border-radius:18px;padding:16px;box-shadow:0 8px 32px rgba(107,159,247,.25);border:3px solid #FFD8B5;animation:popIn .3s cubic-bezier(.34,1.56,.64,1);max-height:96%;overflow-y:auto}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.event-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:2px dashed #FFE0CC}
.event-modal-header .emh-left{font-size:11px;color:#9B7E6E;font-weight:bold}
.event-modal-header .emh-close{width:28px;height:28px;border-radius:50%;background:#FFE0CC;color:#9B7E6E;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold}
.event-modal-header .emh-close:active{transform:scale(.92)}
.npc-dialogue{background:linear-gradient(135deg,#FFF4E6,#FFE8D0);border-radius:14px;padding:10px 14px;margin:8px 0 10px;border-left:4px solid #FFB088;position:relative;font-size:12px;line-height:1.5;color:#6B5840}
.npc-dialogue::before{content:'';position:absolute;left:-4px;top:14px;width:0;height:0;border:6px solid transparent;border-right-color:#FFB088}
.npc-dialogue .nd-name{font-weight:bold;color:#D97757;margin-right:6px}
.npc-dialogue .nd-text{color:#6B5840}

/* V6.9.2 精力警告横幅 */
.energy-warn{text-align:center;padding:6px 10px;margin:4px 0 8px;border-radius:8px;font-size:11px;font-weight:bold;animation:pulse-warn 1.5s ease infinite}
.energy-warn.caution{background:linear-gradient(135deg,#FFE8C0,#FFD580);color:#8B5A1A;border:1.5px solid #D5A85C}
.energy-warn.danger{background:linear-gradient(135deg,#FFD5D5,#FFB0B0);color:#8B1A1A;border:1.5px solid #C93030}
@keyframes pulse-warn{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* V6.9.2 保守选项随机属性标识 */
.opt-random{display:inline-block;padding:1px 6px;border-radius:6px;background:linear-gradient(135deg,#9F7AEA,#6B9DF7);color:#fff;font-size:10px;font-weight:bold;animation:opt-random-glow 2s ease infinite}
@keyframes opt-random-glow{0%,100%{box-shadow:0 0 0 rgba(159,122,234,0)}50%{box-shadow:0 0 6px rgba(159,122,234,.6)}}

/* V6.9.2 加精力事件 tip */
.energy-event-tip{text-align:center;font-size:10px;color:#5A9A4A;background:rgba(213,240,204,.5);border-radius:6px;padding:4px 8px;margin-top:6px;font-weight:bold}
.event-modal.energy-event{border-color:#5A9A4A;background:linear-gradient(135deg,#F0F8E8,#E8F8E0)}
.inner-monologue{background:rgba(255,229,236,.6);border-radius:8px;padding:4px 10px;margin:4px 12px;font-size:11px;color:#C77B8E;font-style:italic;border-left:3px solid #FFB5B5;animation:fadeIn .4s ease}
.inner-monologue::before{content:'💭 ';opacity:.7}

/* V6.4-V6.5 结算页：综合评语 + 高光瞬间 */
.settle-summary{background:linear-gradient(135deg,#FFE5D0,#FFD0C0);border-radius:18px;padding:18px 20px;margin:14px 16px;text-align:center;border:3px solid #FFB088;box-shadow:0 4px 12px rgba(217,119,87,.2)}
.settle-summary .ss-rating{font-size:22px;font-weight:bold;color:#6B5840;margin-bottom:4px;letter-spacing:1px}
.settle-summary .ss-rating::before{content:'✨';margin-right:6px}
.settle-summary .ss-sub{font-size:13px;color:#9B7E6E;margin-top:2px}
.settle-summary .ss-comment{font-size:12px;color:#6B5840;line-height:1.6;margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.5);border-radius:10px}

/* 高光瞬间卡片 */
.highlight-section{padding:0 16px;margin-top:8px}
.highlight-section-title{font-size:13px;font-weight:bold;color:#6B5840;margin-bottom:8px;display:flex;align-items:center;gap:6px;padding-left:4px}
.highlight-section-title::before{content:'🌟';font-size:16px}
.highlight-card{background:#FFF8F0;border-radius:14px;padding:12px 14px;margin-bottom:8px;border-left:5px solid;border-right:2px solid #FFE0CC;border-top:2px solid #FFE0CC;border-bottom:2px solid #FFE0CC;box-shadow:0 2px 6px rgba(107,159,247,.08);display:flex;align-items:flex-start;gap:10px;animation:slideIn .4s ease}
.highlight-card.epic{border-left-color:#FF7B7B;background:linear-gradient(135deg,#FFF8F0,#FFE5E5)}
.highlight-card.great{border-left-color:#FFB088;background:linear-gradient(135deg,#FFF8F0,#FFE5D0)}
.highlight-card.ok{border-left-color:#6B9DF7;background:linear-gradient(135deg,#FFF8F0,#E5F0FF)}
.highlight-card.fun{border-left-color:#9F7AEA;background:linear-gradient(135deg,#FFF8F0,#F0E5FF)}
.highlight-card.fumble{border-left-color:#9B7E6E;background:linear-gradient(135deg,#FFF8F0,#F0E8E0)}
@keyframes slideIn{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.highlight-card .hc-emoji{font-size:24px;flex-shrink:0;line-height:1}
.highlight-card .hc-body{flex:1;min-width:0}
.highlight-card .hc-label{font-size:10px;font-weight:bold;color:#9B7E6E;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.highlight-card .hc-title{font-size:13px;font-weight:bold;color:#6B5840;line-height:1.4;margin-bottom:3px}
.highlight-card .hc-detail{font-size:11px;color:#9B7E6E;line-height:1.4}
.highlight-card .hc-gain{font-size:11px;color:#6B9DF7;font-weight:bold;margin-top:3px}
.highlight-card .hc-gain.negative{color:#E88A8A}
.personality-card .p-npc-dialogue{margin-top:8px;padding:6px 10px;background:linear-gradient(135deg,#FFF4E6,#FFE8D0);border-radius:10px;border-left:3px solid #FFB088;font-size:11px;line-height:1.5;color:#6B5840}
.personality-card .p-npc-dialogue .nd-name{font-weight:bold;color:#D97757;margin-right:3px}.wait-hint{text-align:center;color:#9B7E6E;font-size:12px;padding:8px 12px;background:rgba(255,229,236,.5);border-radius:10px;margin:6px 16px;border:1.5px dashed #FFB5B5;animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
/* V6.5 新增：开屏"美好的一天" */
.intro-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#FFE5D0,#FFD0C0 50%,#FFB5B5);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;animation:fadeIn .6s ease}
.intro-screen .is-emoji{font-size:80px;margin-bottom:20px;animation:float 2.4s ease infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.intro-screen .is-title{font-size:24px;font-weight:bold;color:#6B5840;margin-bottom:8px;letter-spacing:2px;animation:fadeInUp 1s ease .3s both}
.intro-screen .is-sub{font-size:13px;color:#9B7E6E;margin-bottom:30px;animation:fadeInUp 1s ease .6s both}
.intro-screen .is-start{margin-top:36px;padding:12px 32px;background:linear-gradient(135deg,#FFB088,#FF7B7B);color:#FFF;border-radius:24px;font-size:15px;font-weight:bold;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(255,123,123,.4);animation:fadeInUp 1s ease 1.2s both}
.intro-screen .is-start:active{transform:scale(.96)}
@keyframes fadeInUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* V6.5 暂停按钮 */
.pause-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,224,204,.9);border:2px solid #FFB088;color:#6B5840;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:50;box-shadow:0 2px 6px rgba(217,119,87,.2)}
.pause-btn:active{transform:scale(.92)}
.pause-btn.paused{background:#FF7B7B;color:#FFF;border-color:#FF7B7B}
.pause-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,248,240,.85);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;animation:fadeIn .25s ease}
.pause-overlay .po-emoji{font-size:60px;margin-bottom:12px}
.pause-overlay .po-title{font-size:20px;font-weight:bold;color:#6B5840;margin-bottom:6px}
.pause-overlay .po-sub{font-size:12px;color:#9B7E6E;margin-bottom:20px}
.pause-overlay .po-resume{padding:10px 28px;background:linear-gradient(135deg,#FFB088,#FF7B7B);color:#FFF;border-radius:20px;font-size:14px;font-weight:bold;border:none;cursor:pointer}

/* V6.5 流水账区域变大 */
.screen{display:flex;flex-direction:column;min-height:100%}
.screen .stream-area{flex:1;min-height:280px;overflow-y:auto;padding:8px 12px;background:linear-gradient(180deg,#FFFCF6 0%,#FFF8F0 100%);border-radius:14px;margin:6px 12px;border:2px solid #FFE0CC;box-shadow:inset 0 2px 8px rgba(255,176,136,.08)}
.screen .stream-area .stream-item{position:relative;padding:8px 4px 8px 6px;border-bottom:1px dashed rgba(255,176,136,.2);font-size:13px;color:#6B5840;line-height:1.6;animation:slideInLeft .4s ease}
.screen .stream-area .stream-item.typing{overflow:hidden;white-space:nowrap;border-right:2px solid #FFB088;animation:typing-width 1.6s steps(40) forwards,blink-caret .8s step-end infinite}
@keyframes typing-width{from{max-width:0;opacity:1}to{max-width:100%;opacity:1}}
@keyframes blink-caret{50%{border-color:transparent}}
@keyframes slideInLeft{from{transform:translateX(-12px);opacity:0}to{transform:translateX(0);opacity:1}}
.screen .stream-area .stream-item .stream-time{color:#9B7E6E;font-weight:bold;margin-right:8px;font-size:11px;display:inline-block;min-width:48px}
.screen .stream-area .stream-item .stream-energy{font-size:10px;font-weight:800;padding:1px 4px;border-radius:4px;margin-left:4px;display:inline-block;animation:energy-pop .6s ease}
.stream-energy.positive{color:#fff;background:linear-gradient(135deg,#5A9A4A,#7BB66A)}
.stream-energy.negative{color:#fff;background:linear-gradient(135deg,#C93030,#E85A5A)}
@keyframes energy-pop{0%{transform:scale(.6);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-12px);opacity:0}to{transform:translateX(0);opacity:1}}
.wait-hint{text-align:center;color:#9B7E6E;font-size:12px;padding:8px 12px;background:rgba(255,229,236,.5);border-radius:10px;margin:6px 16px;border:1.5px dashed #FFB5B5;animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}

/* V6.5 结算页：半身像 + 对话框 + 属性加减 */
.settle-dialog{position:relative;padding:80px 16px 16px;margin:0 12px 12px;min-height:200px}
.settle-portrait{position:absolute;left:50%;top:0;transform:translateX(-50%);width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#FFE5D0,#FFD0C0);border:5px solid #FFF;box-shadow:0 6px 16px rgba(217,119,87,.3);display:flex;align-items:center;justify-content:center;font-size:64px;z-index:5;animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
.settle-portrait::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:14px solid #FFF}
.settle-portrait .sp-name{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:bold;color:#6B5840;background:#FFF;padding:2px 10px;border-radius:10px;border:2px solid #FFE0CC;white-space:nowrap}
.settle-dialog-bubble{position:relative;background:#FFF;border-radius:16px;padding:14px 16px;margin-top:40px;border:2px solid #FFE0CC;box-shadow:0 4px 10px rgba(107,159,247,.1)}
.settle-dialog-bubble::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:10px solid #FFE0CC}
.settle-dialog-bubble::after{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:8px solid #FFF}
.settle-dialog-bubble .sdb-rating{font-size:16px;font-weight:bold;color:#6B5840;margin-bottom:4px;text-align:center}
.settle-dialog-bubble .sdb-rating::before{content:'✨';margin-right:4px}
.settle-dialog-bubble .sdb-comment{font-size:12px;color:#6B5840;line-height:1.6;text-align:center}
.settle-dialog-bubble .sdb-npc{margin-top:8px;font-size:10px;color:#9B7E6E;text-align:center;font-style:italic}
.settle-dialog-bubble .sdb-npc::before{content:'— ';color:#FFB088}

.settle-delta-section{margin:8px 12px}
.settle-delta-section-title{font-size:12px;font-weight:bold;color:#6B5840;margin-bottom:6px;padding-left:4px}
.settle-delta-section-title::before{content:'📊';margin-right:4px}
.settle-delta-row{display:flex;align-items:center;gap:8px;background:#FFF8F0;border-radius:10px;padding:8px 12px;margin-bottom:4px;border:1.5px solid #FFE0CC}
.settle-delta-row .sdr-emoji{font-size:18px}
.settle-delta-row .sdr-name{flex:1;font-size:12px;color:#6B5840;font-weight:bold}
.settle-delta-row .sdr-from{font-size:12px;color:#9B7E6E}
.settle-delta-row .sdr-arrow{color:#FFB088;font-size:12px}
.settle-delta-row .sdr-to{font-size:13px;font-weight:bold;color:#6B9DF7}
.settle-delta-row .sdr-delta{margin-left:auto;font-size:13px;font-weight:bold;padding:2px 8px;border-radius:8px;min-width:48px;text-align:center}
.settle-delta-row .sdr-delta.positive{background:rgba(107,159,247,.15);color:#6B9DF7}
.settle-delta-row .sdr-delta.negative{background:rgba(232,138,138,.15);color:#E88A8A}
.settle-delta-row .sdr-delta.zero{background:rgba(155,126,110,.15);color:#9B7E6E}

/* V6.9.2 段 1+2 合并：评语 + 属性 + 精力（紧凑） */
.settle-player-name{text-align:center;font-size:13px;font-weight:bold;color:#6B5840;margin:-4px 0 8px;letter-spacing:1px}
.settle-player-name::before{content:'🌟 '}
.settle-player-name::after{content:' 🌟'}
.settle-rating{text-align:center;padding:10px 12px 8px;margin:0 12px 8px;background:linear-gradient(135deg,#FFE5D0 0%,#FFD0C0 100%);border-radius:14px;border:2px solid #FFB088;box-shadow:0 2px 8px rgba(217,119,87,.18);position:relative;overflow:hidden}
.settle-rating::before{content:'';position:absolute;top:-30px;right:-30px;width:60px;height:60px;background:radial-gradient(circle,rgba(255,255,255,.4) 0%,transparent 70%);border-radius:50%}
.settle-rating .sr-emoji{font-size:26px;line-height:1;margin-bottom:2px;display:inline-block}
.settle-rating .sr-title{font-size:16px;font-weight:900;color:#6B5840;letter-spacing:1px;margin-bottom:3px}
.settle-rating .sr-comment{font-size:10px;color:#6B5840;line-height:1.5;opacity:.85;margin-bottom:6px}
.settle-rating .sr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}
.settle-rating .ss-stat{display:flex;align-items:center;justify-content:center;gap:2px;background:rgba(255,255,255,.55);border-radius:8px;padding:3px 2px;font-size:10px;font-weight:800;border:1px solid rgba(255,255,255,.6)}
.settle-rating .ss-stat .sss-emoji{font-size:11px;line-height:1}
.settle-rating .ss-stat .sss-num{font-size:11px;font-weight:900;line-height:1}
.settle-rating .ss-stat.positive .sss-num{color:#4A8A3A}
.settle-rating .ss-stat.negative .sss-num{color:#C93030}
.settle-rating .ss-stat.zero .sss-num{color:#9B7E6E}
.settle-rating .sr-energy{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.5);border-radius:10px;padding:5px 8px;margin-top:4px}
.settle-rating .sr-energy .sre-emoji{font-size:16px;line-height:1;flex-shrink:0}
.settle-rating .sr-energy .sre-label{font-size:10px;color:#9B7E6E;font-weight:bold;letter-spacing:.5px}
.settle-rating .sr-energy .sre-value{font-size:16px;font-weight:900;line-height:1}
.settle-rating .sr-energy .sre-zone{font-size:10px;font-weight:bold;margin-left:2px;opacity:.85}
.settle-rating .sr-energy .settle-chart{width:80px;height:30px;flex-shrink:0;background:none;margin-left:auto}

/* V6.9 段 3 夸赞 */
.highlight-card .hc-praise{font-size:11px;color:#9B7E6E;line-height:1.5;margin-top:4px;padding:4px 8px;background:rgba(255,255,255,.5);border-radius:6px;font-style:italic}

/* V6.9.2 段 4 紧凑独白（横排） */
.settle-mini-dialog{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FFF8F0,#FFFAF0);border-radius:12px;padding:6px 10px;margin:8px 12px;border:1.5px solid #FFE0CC}
.settle-mini-dialog .smd-portrait{font-size:24px;line-height:1;flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFE5D0,#FFD0C0);border-radius:50%;border:2px solid #FFF}
.settle-mini-dialog .smd-mono{flex:1;font-size:11px;color:#6B5840;line-height:1.5;font-style:italic}
@keyframes bounce-soft{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.settle-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 12px 0}
.settle-actions .sa-btn{padding:12px;border-radius:14px;font-size:13px;font-weight:bold;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s ease}
.settle-actions .sa-btn:active{transform:scale(.96)}
.settle-actions .sa-home{background:linear-gradient(135deg,#FFE5D0,#FFD0C0);color:#6B5840;border:2px solid #FFB088}
.settle-actions .sa-home .sa-emoji{font-size:22px}
.settle-actions .sa-home .sa-sub{font-size:10px;color:#9B7E6E;font-weight:normal}
.settle-actions .sa-tomorrow{background:linear-gradient(135deg,#A8D8FF,#6B9DF7);color:#FFF;border:2px solid #6B9DF7;box-shadow:0 4px 12px rgba(107,159,247,.3)}
.settle-actions .sa-tomorrow .sa-emoji{font-size:22px}
.settle-actions .sa-tomorrow .sa-sub{font-size:10px;color:rgba(255,255,255,.85);font-weight:normal}

/* V6.8 选项卡 / 倒计时 / 反馈气泡 / 时段chip */
.countdown-ring{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.countdown-num{position:absolute;font-size:14px;font-weight:bold;color:#FF7B7B;line-height:1}
.time-chip{background:#fff;border-radius:10px;padding:3px 8px;font-size:10px;display:flex;align-items:center;gap:3px}
.time-chip .tc-label{color:var(--text-soft);font-weight:bold}
.opts-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 6px;max-height:340px;overflow-y:auto;padding:0 2px}
.opt-card{background:#fff;border-radius:14px;padding:11px 12px;box-shadow:0 2px 0 var(--line);border:2px solid #fff;transition:all .15s;position:relative;overflow:hidden;min-height:64px}
.opt-card:active{transform:scale(.98)}
.opt-card.opt-disabled{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.opt-card.tier-epic{border-color:#FF6B6B;background:linear-gradient(135deg,#FFE5E5,#FFD5D5)}
.opt-card.tier-great{border-color:#FFB088;background:linear-gradient(135deg,#FFE5D0,#FFF8F0)}
.opt-card.tier-ok{border-color:#E0D0C0;background:#FFF8F0}
.opt-card.tier-fumble{border-color:#C93030;background:#FFE5E5}
.opt-head{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.opt-tier{font-size:10px;font-weight:bold;padding:2px 7px;border-radius:4px;background:#fff;color:var(--text-soft);flex-shrink:0}
.tier-epic .opt-tier{background:#FF6B6B;color:#fff}
.tier-great .opt-tier{background:#FFB088;color:#fff}
.tier-ok .opt-tier{background:#9B7E6E;color:#fff}
.tier-fumble .opt-tier{background:#C93030;color:#fff}
.opt-label{font-size:13px;font-weight:bold;color:var(--text);flex:1;line-height:1.4}
.opt-need{font-size:11px;color:var(--text-soft);display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.opt-cost{padding:2px 6px;border-radius:4px;background:#F0E0D0;color:var(--text-soft);font-size:10px}
.opt-cost.enough{background:#E8F5E0;color:#5A9A4A;font-weight:bold}
.opt-cost.short{background:#FFE5E5;color:#C93030;font-weight:bold}
.opt-cost .oc-count{font-size:8px;opacity:.8;margin-left:1px}
.opt-cost-free{padding:2px 6px;border-radius:4px;background:#F5F5F5;color:#999;font-size:10px;font-style:italic}
.opt-effect{font-size:11px;color:var(--text);display:flex;flex-wrap:wrap;gap:4px;line-height:1.4}
.opt-effect .pos{color:#5A9A4A;font-weight:bold}
.opt-effect .neg{color:#C93030;font-weight:bold}
.opt-energy{color:#FF9E5C;font-weight:bold;background:#FFF4E5;padding:2px 5px;border-radius:3px;font-size:10px}
.feedback-bubble{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#FFD580,#FF7B7B);color:#fff;font-size:20px;font-weight:900;padding:12px 28px;border-radius:24px;box-shadow:0 8px 24px rgba(255,123,123,.5);z-index:200;animation:feedback-pop 1.8s ease-out forwards;letter-spacing:2px;text-shadow:0 2px 4px rgba(0,0,0,.2)}
@keyframes feedback-pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.3);opacity:1}40%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-70%) scale(.9);opacity:0}}

/* V6.8 事件完成小卡（出牌后弹出，2 秒淡出） */
.event-complete-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,248,240,.94);display:flex;align-items:center;justify-content:center;z-index:160;animation:ec-fade-in .35s ease forwards}
.event-complete-card{background:#fff;border-radius:20px;padding:18px 22px;box-shadow:0 10px 28px rgba(255,123,123,.18);text-align:center;max-width:340px;width:88%;animation:ec-pop .4s cubic-bezier(.34,1.56,.64,1) forwards}
.event-complete-emoji{font-size:48px;margin-bottom:6px;line-height:1}
.event-complete-title{font-size:15px;font-weight:bold;color:var(--text);margin-bottom:4px}
.event-complete-desc{font-size:12px;color:var(--text-soft);line-height:1.5;margin-bottom:8px;padding:0 4px}
.event-complete-effects{font-size:12px;color:var(--text);display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font-weight:bold}
.event-complete-effects .ec-chip{padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.8);border:1.5px solid #FFE0CC;display:inline-block;font-size:11px;animation:chip-pop .3s ease}
.event-complete-effects .ec-chip.pos{color:#5A9A4A;background:linear-gradient(135deg,#E8F5E0,#D5F0CC);border-color:#A0D0A0}
.event-complete-effects .ec-chip.neg{color:#C93030;background:linear-gradient(135deg,#FFE8E8,#FFD5D5);border-color:#E0A0A0}
.event-complete-effects .ec-chip.energy-pos{color:#FF9E5C;background:linear-gradient(135deg,#FFF4E5,#FFE0CC);border-color:#FFB088}
.event-complete-effects .ec-chip.energy-neg{color:#5A9A4A;background:linear-gradient(135deg,#E8F5E0,#D5F0CC);border-color:#A0D0A0}
@keyframes chip-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ec-fade-in{from{opacity:0}to{opacity:1}}
@keyframes ec-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
.event-complete-overlay.closing{animation:ec-fade-out .35s ease forwards}
@keyframes ec-fade-out{from{opacity:1}to{opacity:0}}

/* V6.8 今日完成庆祝（10 事件全部完成，进结算前） */
.day-end-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,248,240,.96);display:flex;align-items:center;justify-content:center;z-index:250;animation:de-fade-in .4s ease}
.day-end-banner{background:linear-gradient(135deg,#FFD580,#FF7B7B);color:#fff;padding:22px 28px;border-radius:20px;text-align:center;box-shadow:0 8px 28px rgba(255,123,123,.4);animation:de-pop .6s cubic-bezier(.34,1.56,.64,1) forwards;max-width:340px;width:88%}
.day-end-emoji{font-size:42px;margin-bottom:8px;line-height:1}
.day-end-title{font-size:17px;font-weight:bold;margin-bottom:6px;letter-spacing:1px}
.day-end-sub{font-size:11px;opacity:.95;line-height:1.5}
@keyframes de-fade-in{from{opacity:0}to{opacity:1}}
@keyframes de-pop{0%{transform:scale(.5);opacity:0}50%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
</style>

      if(ring)ring.style.strokeDashoffset=113*(1-State.countdown/60);
    }
  },1000);
}
function stopCountdown(){
  if(State.countdownTimer){clearInterval(State.countdownTimer);State.countdownTimer=null;}
}

// 超时自动选（V6.9.3：取消放弃，按 0>1>2 优先级）
function autoSelect(){
  for(let i=0;i<3;i++){
    const ck=checkOptionRequire(i);
    if(ck.ok){executePlay(i);return;}
  }
  // 都不满足就选保守（保底）
  executePlay(2);
}

function executePlay(optionIdx){
  if(State.pendingNext)return;
  const ev=State.currentEvent;
  if(!ev||!ev.options||!ev.options[optionIdx])return;
  const opt=ev.options[optionIdx];
  const requireCheck=checkOptionRequire(optionIdx);
  if(!requireCheck.ok)return;
  // ===== V6.9.2 isEnergyEvent 加精力事件独立处理 =====
  if(ev.isEnergyEvent){
    // 3 个选项：恢复精力 + 少量属性
    const energyEffects=[
      {energy:25,stats:{心理:2},title:'☕ 开心收下',emoji:'☕'},
      {energy:10,stats:{纪律:1},title:'🙂 假装没事',emoji:'🙂'},
      {energy:15,stats:{心理:1,纪律:1},title:'🤝 婉拒分享',emoji:'🤝'}
    ];
    const eff=energyEffects[optionIdx]||energyEffects[0];
    // 应用精力恢复
    State.energy=clamp(State.energy+eff.energy,0,150);
    State.energyLog.push({type:'event_gain',val:eff.energy,at:Date.now()});
    State.energyHistory.push({e:State.energy,t:Date.now()});
    // 应用属性
    for(const s in eff.stats){
      State.stats[s]=clamp(State.stats[s]+eff.stats[s],0,STAT_MAX);
    }
    // 记 log
    State.logs.push({
      eventTitle:ev.title,
      eventType:'rec',
      eventDifficulty:0,
      optionIdx,
      optionLabel:opt,
      cardConsumed:0,
      combo:0,
      type:'energy_event',
      title:eff.title,
      desc:opt,
      effects:eff.stats,
      energyDelta:eff.energy,
      stats:{...State.stats},
      energy:State.energy
    });
    // 飘字
    triggerExp({effects:eff.stats,energyDelta:eff.energy,combo:0,type:'normal'});
    // 事件完成小卡
    showEventComplete({
      emoji:eff.emoji,
      title:eff.title,
      desc:opt,
      effects:eff.stats,
      energyDelta:eff.energy
    });
    stopCountdown();
    State.eventsCompleted++;
    if(State.energyEventCD>0)State.energyEventCD--;
    if(State.energyAdCD>0)State.energyAdCD--;
    if(State.eventsCompleted>=TOTAL_EVENTS){
      if(!State.dayEnding){
        State.dayEnding=true;
        setTimeout(()=>{
          if(State.phase!=='play')return;
          for(let i=0;i<3;i++){
            if(State.streamIndex < STREAMS.length) pushStream();
          }
          setTimeout(()=>{
            State.streamHistory.push({text:STREAMS_END,time:'🌙 深夜',isEnding:true});
            render();
            setTimeout(()=>{
              if(State.phase!=='play')return;
              const ov=document.createElement('div');
              ov.className='blackout-overlay';
              ov.innerHTML='<div class="blackout-emoji">🌙</div><div class="blackout-text">夜深了...</div>';
              document.querySelector('.phone-frame')?.appendChild(ov);
              setTimeout(()=>{
                if(State.phase!=='play')return;
                State.phase='settlement';
                render();
              },1800);
            },1200);
          },800);
        },600);
      }
      return;
    }
    State.pendingNext=true;
    setTimeout(()=>{
      if(State.phase!=='play'||!State.pendingNext)return;
      State.pendingNext=false;
      State.currentEvent=null;
      State.eventsStarted=false;
      const ec=document.querySelector('.event-complete-overlay');
      if(ec){ec.classList.add('closing');setTimeout(()=>{if(ec.parentNode)ec.remove()},380)}
      State.streamStarted=true;
      State.nextEventThreshold=4+Math.floor(Math.random()*4);
      render();
    },2200);
    render();
    return;
  }
  const tpl=OPTION_TEMPLATES[optionIdx];
  // 消耗卡牌（弃牌堆不回）
  requireCheck.consume.forEach(uid=>{
    const c=State.deck.find(c=>c.uid===uid);
    if(c){
      State.discardPile.push(c);
      State.deck=State.deck.filter(d=>d.uid!==uid);
    }
  });
  // ===== V6.9.2 改造 =====
  // 1. 保守（optionIdx===2）：生成随机小幅属性
  // 2. 30% 精力以下：消耗精力的选项有 50% 概率反转（+变-）
  // 3. 50% 精力以下：显示提示
  let baseEffects={...tpl.effects};
  if(baseEffects===null||optionIdx===2){
    // 随机生成保守属性：从 STATS 中随机选 1-2 个，每个 -1~+1
    baseEffects={};
    const statKeys=STATS.slice();
    // 打乱
    for(let i=statKeys.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[statKeys[i],statKeys[j]]=[statKeys[j],statKeys[i]]}
    const num=1+Math.floor(Math.random()*2);
    for(let i=0;i<num;i++){
      const s=statKeys[i];
      // 60% 概率 -1，40% 概率 +1
      baseEffects[s]=Math.random()<0.6?-1:1;
    }
  }
  // 30% 精力反转：消耗精力的选项（破局/稳进/放弃），50% 概率反转
  let deviated=false;
  if(State.energy<30 && tpl.energyCost>0 && optionIdx!==2){
    if(Math.random()<0.5){
      // 反转：所有效果符号反向
      for(const s in baseEffects)baseEffects[s]=-baseEffects[s];
      deviated=true;
    }
  }
  // V6.9 应用属性效果（按精力档位乘数）+ 精力消耗
  const allE=applyEWithEnergy(baseEffects);
  let eCost=tpl.energyCost||0;
  if(eCost>0)applyEnergyCost(eCost);
  const eDelta=-eCost;  // log/飘字用，负数表示消耗
  if(optionIdx===0){
    State.combo++;
    if(State.combo>State.maxCombo)State.maxCombo=State.combo;
  }else if(optionIdx===1){
    if(State.combo>0&&State.combo<3)State.combo++;else State.combo=1;
  }else{
    State.combo=0;
  }
  // 反馈气泡
  if(tpl.feedback)enqueueFeedback(tpl.feedback);
  // 30% 精力偏差：弹小提示
  if(deviated){
    setTimeout(()=>{enqueueFeedback('⚠️ 精力过低，执行有偏差！')},100);
  }
  // 50% 精力提示（只提示一次）
  if(State.energy<50 && !State.lowEnergyTipShown){
    State.lowEnergyTipShown=true;
    setTimeout(()=>{enqueueFeedback('💡 精力不足，获得的属性会减少')},200);
  }
  // 记 log
  const type=optionIdx===0?'epic':optionIdx===1?'great':'ok';
  State.logs.push({
    eventTitle:ev.title,
    eventType:ev.type,
    eventDifficulty:ev.difficulty,
    optionIdx,
    optionLabel:opt,
    cardConsumed:requireCheck.consume.length,
    combo:State.combo,
    type,
    title:deviated?'⚠️ '+tpl.title:tpl.title,
    desc:opt,
    effects:allE,
    energyDelta:eDelta,
    stats:{...State.stats},
    energy:State.energy,
    deviated
  });
  // 飘字
  triggerExp({effects:allE,energyDelta:eDelta,combo:State.combo,type});
  // V6.8 事件完成小卡（2 秒展示，飘字更慢看得清）
  showEventComplete({
    emoji:deviated?'⚠️':(optionIdx===0?'🎯':optionIdx===1?'⚡':'🤷'),
    title:deviated?'⚠️ '+tpl.title:tpl.title,
    desc:deviated?'精力过低，执行有偏差！':opt,
    effects:allE,
    energyDelta:eDelta
  });
  // 进度
  stopCountdown();
  State.eventsCompleted++;
  // V6.9.2 加精力事件 CD 减 1
  if(State.energyEventCD>0)State.energyEventCD--;
  // V6.9.2 看广告 CD 减 1
  if(State.energyAdCD>0)State.energyAdCD--;
  if(State.eventsCompleted>=TOTAL_EVENTS){
    // V6.9.3 改造：5 个事件后继续播 2 条结束流水 → 出结束语 → 黑屏 → 结算
    if(!State.dayEnding){
      State.dayEnding=true;
      setTimeout(()=>{
        if(State.phase!=='play')return;
        // 推 2-3 条结束流水
        for(let i=0;i<3;i++){
          if(State.streamIndex < STREAMS.length) pushStream();
        }
        // 出结束语
        setTimeout(()=>{
          State.streamHistory.push({text:STREAMS_END,time:'🌙 深夜',isEnding:true});
          render();
          // 黑屏转场
          setTimeout(()=>{
            if(State.phase!=='play')return;
            const ov=document.createElement('div');
            ov.className='blackout-overlay';
            ov.innerHTML='<div class="blackout-emoji">🌙</div><div class="blackout-text">夜深了...</div>';
            document.querySelector('.phone-frame')?.appendChild(ov);
            setTimeout(()=>{
              if(State.phase!=='play')return;
              State.phase='settlement';
              render();
            },1800);
          },1200);
        },800);
      },600);
    }
    return;
  }
  State.pendingNext=true;
  setTimeout(()=>{
    if(State.phase!=='play'||!State.pendingNext)return;
    State.pendingNext=false;
    State.currentEvent=null;
    State.eventsStarted=false;
    // 移除事件完成小卡
    const ec=document.querySelector('.event-complete-overlay');
    if(ec){ec.classList.add('closing');setTimeout(()=>{if(ec.parentNode)ec.remove()},380)}
    State.streamStarted=true;
    State.nextEventThreshold=4+Math.floor(Math.random()*4);
    render();
  },2200);
  render();
}

function showEventComplete(data){

function triggerExp(r,cards,ev,isMis,relief){const c=document.querySelector('.phone-frame');if(!c)return;const r2=c.getBoundingClientRect();const cx=r2.left+r2.width/2;const cy=r2.top+r2.height*.5;const isFumble=r.type==='fumble'||isMis;if(isFumble){Object.entries(r.effects||{}).forEach(([s,v],i)=>{if(v<0)setTimeout(()=>{const f=document.createElement('div');f.className='fly-number-down';f.textContent=`${s}${v}`;f.style.left=(cx-40+i*30)+'px';f.style.top=(cy-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),2500)},i*100)});c.classList.add('screen-shake-light');setTimeout(()=>c.classList.remove('screen-shake-light'),200)}else{Object.entries(r.effects||{}).forEach(([s,v],i)=>{if(v!==0)setTimeout(()=>{const f=document.createElement('div');f.className='fly-number positive';f.textContent=`${s}${v>0?'+':''}${v}`;f.style.left=(cx-40+i*25)+'px';f.style.top=(cy-50)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),2500)},i*100)});if(r.combo>=2){const f=document.createElement('div');f.className='fly-number combo';f.textContent=`🔥 x${r.combo}连击!`;f.style.left=(cx-80)+'px';f.style.top=(cy-110)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),2500)}if(r.combo>=3)showBurst();if(r.combo>=2){c.classList.add('screen-shake-light');setTimeout(()=>c.classList.remove('screen-shake-light'),200)}}if(r.energyDelta){const f=document.createElement('div');f.className=r.energyDelta<0?'fly-number-down':'fly-number positive';f.textContent=`精力${r.energyDelta>0?'+':''}${r.energyDelta}`;f.style.left=(cx+60)+'px';f.style.top=(cy-50)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),2500)}}
function showBurst(){const b=document.createElement('div');b.className='perfect-burst';const colors=['#FFD580','#FF6B6B','#FFB5B5','#6B9DF7','#7BC06B','#FFFFFF'];for(let i=0;i<30;i++){const p=document.createElement('div');p.className='perfect-particle';p.style.left='50%';p.style.top='50%';p.style.background=colors[Math.floor(Math.random()*colors.length)];const a=(Math.PI*2*i)/30;const d=180+Math.random()*180;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');b.appendChild(p)}document.body.appendChild(b);setTimeout(()=>b.remove(),1300)}

// V6.9.3 根据当前流水时间找对应事件 + 加精力事件判断
function getNextEvent(){
  // 加精力事件：精力 ≤ 50 且 CD=0 时强制触发（事件期间穿插）
  if(State.energy<=50 && State.energyEventCD===0 && !State.currentEvent.isEnergyEvent){
    State.energyEventCD=2;
    return {
      id:'ev_energy_'+State.eventsCompleted,
      time:'现在',icon:'🎁',accent:'#5A9A4A',bgColor:'linear-gradient(135deg,#D5F0CC,#E8F8E0)',
      title:'🎁 收到一份小惊喜',
      npcName:'好心人',npcLine:'嘿，送你一份小礼物！',
      desc:'你遇到一份小礼物——一杯热可可、一块蛋糕、或一句关心的问候。',
      type:'rec',difficulty:0,isObserver:false,complexity:1,
      isEnergyEvent:true,
      options:['开心地收下','假装没事继续忙','婉拒并分享给别人'],
      eventColor:'#5A9A4A'
    };
  }
  // V6.9.3 根据 streamIndex 找 STREAMS 里的 isEvent 事件
  const idx=Math.min(State.streamIndex,STREAMS.length-1);
  const curStream=STREAMS[idx];
  if(curStream && curStream.isEvent){
    const ev=EVENTS.find(e=>e.id===curStream.isEvent);
    if(ev)return ev;
  }
  // 兜底：随机选一个未发生过的
  const recent=State.logs.slice(-5).map(l=>l.eventTitle);
  let ev;let a=0;
  do{ev=pick(EVENTS);a++}while(recent.includes(ev.title)&&a<10);
  return ev;
}

function renderSettle(){

    let score=0,level='ok',emoji='✨',label='平稳应对',gainText='',praise='';

    }else if(l.type==='great'){

      praise='稳中求进，不错不错。';
      const gParts=[];
      for(const s in l.effects||{}){if(l.effects[s]>0)gParts.push(`${s}+${l.effects[s]}`);}
      gainText=gParts.length?`+${gParts.join(' ')}`:'';
    }else if(l.type==='ok'){

      praise='没有冒进，先求稳也是种智慧。';
      gainText=l.cardConsumed?`消耗 ${l.cardConsumed} 张卡`:'无消耗';

      praise='有时候放弃也是一种选择。';
    }
    return {score,level,emoji,label,l,gainText,praise};
  });
  scored.sort((a,b)=>b.score-a.score);
  const best=scored[0];
  // 精力曲线图（V6.9.2 缩短版）
  const hist=State.energyHistory||[];
  let energyChart='';
  if(hist.length>=2){
    const chartW=280,chartH=50,pad=4;

    const minE=Math.min(0,...hist.map(h=>h.e));
    const range=Math.max(1,maxE-minE);
    const stepX=hist.length>1?(chartW-pad*2)/(hist.length-1):0;
    const points=hist.map((h,i)=>{
      const x=pad+i*stepX;
      const y=pad+(1-(h.e-minE)/range)*(chartH-pad*2);
      return [x,y];
    });
    const chartPath=points.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const chartDots=points.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.8" fill="${pz.color}"/>`).join('');
    energyChart=`<svg class="settle-chart" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none">
        <path d="${chartPath}" stroke="${pz.color}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        ${chartDots}
      </svg>`;
  }
  // 属性缩略行
  const statChips=STATS.map(s=>{
    const delta=State.stats[s]-init[s];
    const info=STAT_INFO[s];
    const dText=delta>0?`+${delta}`:delta<0?`${delta}`:'±0';
    return `<div class="ss-stat ${delta>0?'pos':delta<0?'neg':'zero'}"><div class="sss-emoji">${info.emoji}</div><div class="sss-num">${dText}</div></div>`;
  }).join('');
  const monologues={
    '踏实稳进型':'今天我稳扎稳打，没出什么大差错。',
    '机智灵活型':'今天脑子转得挺快，几个巧招解决了不少事。',
    '行动派型':'今天我冲在前面，虽然累但感觉很充实。',
    '内省探索型':'今天我观察了很多，也思考了很多。'
  };
  const mono=monologues[State.personality]||'今天又过完了一天。';
  const highlightHtml=!best?`<div class="highlight-card ok"><div class="hc-emoji">📝</div><div class="hc-body"><div class="hc-title">今天平淡无奇</div><div class="hc-detail">没有发生什么特别的事。</div><div class="hc-praise">😌 平平淡淡才是真。</div></div></div>`:`<div class="highlight-card ${best.level}"><div class="hc-emoji"><img src="${_getHighLightPortrait()}" alt="hl" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/></div><div class="hc-body"><div class="hc-label">${best.label}</div><div class="hc-title">${best.l.eventTitle}</div><div class="hc-detail">${best.l.optionLabel?best.l.optionLabel:'未选'}</div>${best.gainText?`<div class="hc-gain">${best.gainText}</div>`:''}<div class="hc-praise">💬 ${best.praise}</div></div></div>`;
  return `<div class="phone-frame"><div class="screen settlement">
    <!-- V6.9.3 玩家半身像（顶部） -->
    <div class="settle-portrait-big">
      <img src="${_getCurrentPortrait()}" alt="player"/>
    </div>
    <div class="settle-player-name">${State.personality||'你'}</div>
    <!-- V6.9.2 段 1+2 合并：评语 + 属性 + 精力（一屏） -->
    <div class="settle-rating">
      <div class="sr-emoji">${rEmoji}</div>
      <div class="sr-title">${rating}</div>
      <div class="sr-comment">${rComment}</div>
      <div class="sr-stats">${statChips}</div>
      <div class="sr-energy">
        <span class="sre-emoji">${pz.cls==='full'?'💪':pz.cls==='good'?'😊':pz.cls==='normal'?'😐':'😩'}</span>
        <span class="sre-label">精力</span>
        <span class="sre-value" style="color:${pz.color}">${finalE}</span>
        <span class="sre-zone" style="color:${pz.color}">${pz.name}×${pz.mult}</span>
        ${energyChart}
      </div>
    </div>
    <!-- 段 3：精彩瞬间 -->
    <div class="highlight-section">
      <div class="highlight-section-title">⭐ 今日高光</div>
      ${highlightHtml}
    </div>
    <!-- 段 4：角色 + 独白（紧凑一行） -->
    <div class="settle-mini-dialog">
      <div class="smd-portrait"><img src="${_getCurrentPortrait()}" alt="p" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/></div>
      <div class="smd-mono">💭 ${mono}</div>
    </div>
    <!-- 段 5：双按钮 -->
    <div class="settle-actions">
      <button class="sa-btn sa-home" id="btn-home"><div class="sa-emoji">🏠</div><div class="sa-label">回家</div><div class="sa-sub">结束今天</div></button>
      <button class="sa-btn sa-tomorrow" id="btn-tomorrow"><div class="sa-emoji">☀️</div><div class="sa-label">开启明天</div><div class="sa-sub">+30%精力</div></button>
    </div>
    <div class="footer-tip">V6.9.3 · 3选项 · 5事件/局 · 流水时间轴 · 半身像结算</div>
  </div></div>`;
}
function bindEvents(){
  if(State.phase==='intro'){
    const ib=document.getElementById('intro-start');
    if(ib)ib.onclick=()=>{
      State.phase='play';
      State.currentEvent=null;
      State.eventsStarted=false;
      State.pendingNext=false;
      // V6.9 第一条流水立即出现（不等）
      State.streamStarted=true;
      State.initialStats={...State.stats};
      startStreamLoop();
      // 立即推一条流水
      pushStream();
      render();
    };
  }else if(State.phase==='init'){
    document.querySelectorAll('.personality-card').forEach(el=>{
      el.onclick=()=>{
        const pid=el.dataset.pid;
        State.personality=pid;
        State.deck=buildDeck(pid);
        State.phase='intro';
        render();
      };
    });
  }else if(State.phase==='play'){
    // V6.9.3 流水中"进入事件"按钮
    document.querySelectorAll('.stream-event-btn').forEach(el=>{el.onclick=()=>{
      if(State.paused||State.pendingNext)return;
      const evIdx=parseInt(el.getAttribute('data-evidx'));
      if(evIdx>=0 && !State.currentEvent){
        const ev=getNextEvent();
        if(ev){
          State.currentEvent=ev;
          State.eventsStarted=true;
          startCountdown();
          render();
        }
      }
    }});
    // V6.8 选项点击（V6.9.3 适配 3 选项）
    document.querySelectorAll('.opt-card').forEach(el=>{
      if(el.classList.contains('opt-disabled'))return;
      el.onclick=()=>{
        if(State.paused)return;
        if(State.pendingNext)return;
        const idx=parseInt(el.dataset.oidx);
        executePlay(idx);
      };
    });
    const ba=document.getElementById('btn-ad');
    if(ba)ba.onclick=()=>{if(!State.paused)useAdRefresh()};
    const pb=document.getElementById('pause-btn');
    if(pb)pb.onclick=()=>{State.paused=!State.paused;render()};
    const pr=document.getElementById('pause-resume');
    if(pr)pr.onclick=()=>{State.paused=false;render()};
  }else if(State.phase==='settlement'){
    // 工具：完全重置（属性也清零）
    const fullReset=()=>{
      State={phase:'init',stats:{智力:50,体魄:50,纪律:50,心理:50},energy:100,dayEnergy:100,energyLog:[],energyHistory:[{e:100,t:0}],deckLevel:0,eventChain:null,currentChainId:null,npcName:null,firstEventTip:false,energyEventCD:0,energyAdCD:0,dayAdCount:0,lowEnergyTipShown:false,coins:0,personality:null,deck:[],discardPile:[],eventsCompleted:0,currentEvent:null,combo:0,maxCombo:0,logs:[],difficultyBonus:0,streamHistory:[],streamIndex:0,eventsStarted:false,pendingNext:false,paused:false,initialStats:null,introShown:false,streamStarted:false,nextEventThreshold:5,adUsed:false,adGained:0,currentTimeIdx:0,countdown:60,countdownTimer:null,feedbackQueue:[],dayEnding:false};
    };
    // 工具：开启下一天（保留 stats 持续累加）
    const nextDay=()=>{
      // V6.9 每晚恢复 30% 精力
      const recovered=recoverEnergyOvernight();
      // 保留 stats，重置其他
      const keptStats={...State.stats};
      const keptInitial={...State.stats}; // 下一轮的"初始属性"= 当前属性
      State={
        phase:'intro',stats:keptStats,energy:State.energy,dayEnergy:State.energy,
        energyLog:[{type:'overnight',val:recovered,at:Date.now()}],
        energyHistory:[{e:State.energy,t:Date.now()}],
        deckLevel:State.deckLevel,eventChain:null,currentChainId:null,npcName:null,firstEventTip:false,energyEventCD:0,energyAdCD:0,dayAdCount:0,lowEnergyTipShown:false,
        coins:State.coins,personality:State.personality,deck:buildDeck(State.personality),discardPile:[],
        eventsCompleted:0,currentEvent:null,combo:0,maxCombo:State.maxCombo,logs:[],
        difficultyBonus:0,streamHistory:[],streamIndex:0,eventsStarted:false,pendingNext:false,
        paused:false,initialStats:keptInitial,introShown:false,streamStarted:false,nextEventThreshold:5,
        adUsed:false,adGained:0,currentTimeIdx:0,countdown:60,countdownTimer:null,feedbackQueue:[],
        dayEnding:false
      };
    };
    const r=document.getElementById('restart');
    if(r)r.onclick=()=>{fullReset();render();};
    const home=document.getElementById('btn-home');
    if(home)home.onclick=()=>{fullReset();render();};
    const tom=document.getElementById('btn-tomorrow');
    if(tom)tom.onclick=()=>{nextDay();render();};
  }
}let streamTimer=null;
function startStreamLoop(){if(streamTimer)clearInterval(streamTimer);streamTimer=setInterval(()=>{if(State.phase!=='play')return;if(State.paused)return;if(State.currentEvent)return;pushStream()},4000)}
function fitFrame(){const frame=document.querySelector('.phone-frame');if(!frame)return;const designW=414,designH=920;const sw=window.innerWidth,sh=window.innerHeight;const padding=10;const scale=Math.min((sw-padding*2)/designW,(sh-padding*2)/designH);frame.style.transform=`translate(-50%,-50%) scale(${scale})`}
window.addEventListener('resize',fitFrame);
window.addEventListener('orientationchange',fitFrame);
window.addEventListener('DOMContentLoaded',()=>{window.State=State;render();startStreamLoop();fitFrame()});
</script>
